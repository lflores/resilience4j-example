server:
  port: 8080

spring:
  application:
    name: producer-app
  jmx:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    jmx:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  server:
    port: 9001

com.sun.management.jmxremote:
  port: 9001
  rmi.port: 9001
  authenticate: false
  ssl: false

info:
  app:
    name: Producer Application
    description: Payment service producer
    version: 1.0.0